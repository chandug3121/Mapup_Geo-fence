name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: geofence_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/geofence_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod

      - name: Resolve modules
        run: go mod tidy

      - name: Show resolved modules
        run: |
          echo "----- go.mod -----"; cat go.mod
          echo "----- go.sum -----"; cat go.sum
          echo "----- end -----"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: go build -o /dev/null ./cmd/server

      - name: Check go.mod and go.sum are committed and tidy
        run: git diff --exit-code -- go.mod go.sum

  docker:
    # Always builds the image to prove the Dockerfile works. On main, with
    # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets set, it also pushes it,
    # and with RENDER_DEPLOY_HOOK set it triggers a Render redeploy.
    needs: test
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.DOCKERHUB_TOKEN != '' }}
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/geofence-backend
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publishing skipped
        if: env.PUBLISH != 'true'
        run: echo "::notice::Image built but not pushed. Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets to publish from main."

      - name: Trigger Render deploy
        if: env.PUBLISH == 'true'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK" > /dev/null && echo "Render deploy triggered"
          else
            echo "RENDER_DEPLOY_HOOK not set; skipping"
          fi
