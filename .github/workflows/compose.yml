name: compose-smoke

# Starts the whole stack with docker compose and runs a real scenario
# against it: seed data, move a vehicle into a zone, check the history.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health; then echo; exit 0; fi
            sleep 2
          done
          docker compose logs api
          exit 1

      - name: Dashboard is served
        run: curl -fsS http://localhost:3000/ | grep -q '<div id="root">'

      - name: Scenario
        run: |
          set -euo pipefail
          ./scripts/seed.sh http://localhost:8080
          VEH=$(curl -fsS http://localhost:8080/vehicles | jq -r '.vehicles[] | select(.vehicle_number=="KA-01-AB-1234") | .id')
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          OUT=$(curl -fsS -X POST http://localhost:8080/vehicles/location -H 'Content-Type: application/json' \
            -d "{\"vehicle_id\":\"$VEH\",\"latitude\":37.779,\"longitude\":-122.4175,\"timestamp\":\"$NOW\"}")
          echo "$OUT" | jq .
          echo "$OUT" | jq -e '.time_ns | type == "string"'
          echo "$OUT" | jq -e '[.current_geofences[].geofence_name] | index("Civic Center Restricted") != null'
          echo "$OUT" | jq -e '.alerts_triggered >= 1'
          curl -fsS "http://localhost:8080/violations/history?vehicle_id=$VEH" | jq -e '.total_count >= 1'

      - name: Logs
        if: always()
        run: docker compose logs --no-color api | tail -50

      - name: Stop stack
        if: always()
        run: docker compose down -v
