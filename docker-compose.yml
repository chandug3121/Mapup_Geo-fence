# Local stack: PostGIS + Go API + dashboard.
#   docker compose up --build
# Dashboard: http://localhost:3000   API: http://localhost:8080

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: geofence
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geofence"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://postgres:postgres@db:5432/geofence?sslmode=disable
      CORS_ORIGINS: "*"
      LOCATION_RATE_LIMIT: "300"
      # API_KEY: change-me   # uncomment to require an X-API-Key header
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
